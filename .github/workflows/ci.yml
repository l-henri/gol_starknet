name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Both actions read tool versions from .tool-versions at the repo root.
      - uses: software-mansion/setup-scarb@v1
      - uses: foundry-rs/setup-snfoundry@v3

      # rustup reads rust-toolchain.toml: the pinned channel with rustfmt and Clippy.
      - run: rustup toolchain install

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/game-of-life/.nvmrc

      # Contracts, Rust SDK and web app: the same script the commit hook runs.
      - run: ./scripts/check.sh
