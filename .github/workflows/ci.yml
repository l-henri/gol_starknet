name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Build & test contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both actions read tool versions from .tool-versions at the repo root.
      - uses: software-mansion/setup-scarb@v1
      - uses: foundry-rs/setup-snfoundry@v3

      - name: Build
        run: scarb build

      - name: Test
        run: snforge test
