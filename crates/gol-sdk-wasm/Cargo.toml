[package]
name = "gol-sdk-wasm"
version = "0.0.0"
edition = "2021"
description = "WASM bindings for gol-sdk — reads + call-building for the browser (signing stays in JS)"
license = "MIT"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gol-sdk = { path = "../gol-sdk" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
# Ensure the getrandom js backend is on for the wasm build (belt-and-braces with gol-sdk).
getrandom = { version = "0.2", features = ["js"] }
